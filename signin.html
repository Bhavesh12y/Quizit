<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In - Quiz-IT</title>
  <link rel="stylesheet" href="signin.css">
  <link href="https://fonts.googleapis.com/css2?family=Freckle+Face&display=swap" rel="stylesheet">
</head>
<body>




  <header class="header">
    <div class="nav-container">
      <div class="logo">QUIZ-IT</div>
      <nav class="nav-menu">
        <a href="#home">HOME</a>
        <a href="#categories">EXPLORE</a>
        <a href="#history">HISTORY</a>
        <a href="#about">ABOUT US</a>
        <a href="#leaderboard">LEADERBOARD</a>
      </nav>
    </div>
  </header>

  <section class="login-section">
    <div class="login-container">
      <div class="login-title">SIGN IN</div>
      <form class="login-form">
        <div class="login-fields">
          <label>Full Name:</label>
          <input type="text" placeholder="Enter full name">
          <label>Username:</label>
          <input type="text" placeholder="Enter username">
          <label>Email:</label>
          <input type="email" placeholder="Enter email">
          <label>Password:</label>
          <input type="password" placeholder="Enter password">
        </div>

        <div class="already">
          Already a user? <a href="login.html">Log In</a>
        </div>
        <div class="login-btns">
          <button type="button" class="login-btn" onclick="window.location.href='login.html'">Log In</button>
          <button type="button" class="login-btn" onclick="window.location.href='login.html'">Sign In</button>
        </div>
        <div class="login-social">
          Or SIGN IN with :
          <img src="google.png" alt="Google" id="googleimg">
          <img src="github.png" alt="GitHub" id="githubimg">
          <img src="discord.png" alt="Discord" id="discordimg">
        </div>
      </form>
    </div>
  </section>

</body>
</html>
