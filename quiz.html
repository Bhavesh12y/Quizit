<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZ PAGE 1</title>
    <link rel="stylesheet" href="quiz.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="quiz-container">
        <div class="quiz-header">
            <span class="quiz-title">QUIZ-IT</span>
        </div>
        <div class="quiz-top-row">
            <span class="quiz-type">Science Quiz</span>
            <span class="quiz-score">Score : 10</span>
        </div>
        <div class="quiz-question-block">
            <div class="quiz-question">The plant tissue responsible for the transportation of water and dissolved minerals from the roots to the rest of the plant is ?</div>
            <form class="quiz-options">
                <label class="quiz-option-label"><input type="radio" name="quiz-option" class="quiz-radio">A. Xylem</label>
                <label class="quiz-option-label"><input type="radio" name="quiz-option" class="quiz-radio">B. Photon</label>
                <label class="quiz-option-label"><input type="radio" name="quiz-option" class="quiz-radio">C. Physics</label>
                <label class="quiz-option-label"><input type="radio" name="quiz-option" class="quiz-radio">D. Chem</label>
            </form>
        </div>
        <div class="quiz-bottom-row">
            <span class="quiz-progress">Question 1 of 10</span>
            <span class="quiz-timer" id="quiz-timer">time left : 2:00:00</span>
        </div>
        <div class="quiz-action-row">
            <button class="quiz-skip" type="button" onclick="window.location.href='quiz2.html'">Skip</button>
            <button class="quiz-submit" type="button" onclick="window.location.href='quiz2.html'">Submit</button>
        </div>
    </div>
</body>
</html>
