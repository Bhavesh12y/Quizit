<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="login.css">
  <style>
        @media (max-width: 600px) {
            .nav-menu {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                background: none;
                padding: 0;
                border-radius: 0;
                width: 100vw;
            }
            .nav-menu a {
                display: none !important;
            }
            .nav-menu a.explore-link {
                display: block !important;
                width: 80px;
                text-align: center;
                font-size: 0.95rem;
                padding: 8px 0;
                background: #4a90e2;
                color: #fff;
                border-radius: 12px;
                margin: 0 0 0 8px;
            }
        }
    </style>
</head>
<body>
    <!-- ===== NAVBAR ===== -->
       <header class="header">
        <div class="nav-container">
            <div class="logo">QUIZ-IT</div>
            <nav class="nav-menu">
                <a href="#login-section">HOME</a>
                <a href="#login-section" class="explore-link">EXPLORE</a>
                <a href="#login-section">HISTORY</a>
                <a href="#login-section">ABOUT US</a>
                <a href="#login-section">LEADERBOARD</a>
            </nav>
        </div>
    </header>

    <!-- ===== LOGIN SECTION ===== -->
    <section class="login-section">
        <!-- Quote in background -->


        <div class="login-container">
            <div class="login-title">LOGIN</div>
            <form class="login-form">
                <div class="login-fields">
                    <div class="form">
                        <label>Username:</label>
                        <input type="text" placeholder="Enter username">
                        <label>Password:</label>
                        <input type="password" placeholder="Enter password">
                    </div>
                    <div class="imglog">
                        <img src="quizitman.webp" alt="Hero" class="login-hero-img">
                    </div>
                </div>
                <div class="login-btns">
                    <button type="button" class="signin-btn" onclick="window.location.href='signin.html'">First time? Sign In</button>
                    <button type="button" class="login-btn" onclick="window.location.href='main.html'">LOG IN</button>
                </div>
                <div class="login-social">
                    Or LOG IN with :
                    <img src="google.png" alt="Google" id="googleimg">
                    <img src="github.png" alt="GitHub" id="githubimg">
                    <img src="discord.png" alt="Discord" id="discordimg">
                </div>
                <span class="forgot-link" onclick="window.location.href='signin.html'">Forgot password ?</span>
            </form>
        </div>
    </section>
</body>
</html>
